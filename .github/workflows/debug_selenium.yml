# .github/workflows/debug_selenium.yml
name: Debug Selenium

on:
  workflow_dispatch:  # 수동 실행만

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 🌐 Setup Chrome
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable
    
    - name: 📦 Install dependencies
      run: |
        pip install selenium
    
    - name: 🐛 Run debug script
      run: |
        python update_lotto_selenium_debug.py
      continue-on-error: true
    
    - name: 📄 Upload debug files
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-output
        path: |
          debug_*.html
          lotto_json.json
        retention-days: 7
    
    - name: 📊 Show debug info
      if: always()
      run: |
        echo "=== 생성된 파일 ==="
        ls -lh *.html *.json || true
        
        echo ""
        echo "=== debug_page.html 앞부분 ==="
        head -n 50 debug_page.html || true
