# .github/workflows/update_lotto_selenium.yml
name: Update Lotto Data (Selenium)

on:
  schedule:
    # 매주 토요일 21:10 (KST) = UTC 12:10
    - cron: '10 12 * * 6'
  
  # 수동 실행 가능
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 🌐 Setup Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install selenium
    
    - name: 🎰 Run Selenium crawler
      run: |
        python update_lotto_selenium.py
      continue-on-error: false
    
    - name: 📊 Check results
      run: |
        if [ -f lotto_json.json ]; then
          echo "✅ JSON 파일 생성 확인"
          ls -lh lotto_json.json
        else
          echo "❌ JSON 파일 없음"
          exit 1
        fi
    
    - name: 💾 Commit and push changes
      run: |
        git config --global user.name 'Lotto Bot'
        git config --global user.email 'bot@lotto.com'
        git add lotto_json.json
        
        if git diff --staged --quiet; then
          echo "변경사항 없음"
        else
          git commit -m "🎰 자동 업데이트: $(date +'%Y-%m-%d %H:%M') KST"
          git push
          echo "✅ 업데이트 완료!"
        fi
    
    - name: 📧 Notify on failure
      if: failure()
      run: |
        echo "❌ 크롤링 실패!"
        echo "수동으로 업데이트가 필요합니다."
