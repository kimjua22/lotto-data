# .github/workflows/update_lotto_selenium.yml
name: Update Lotto Data (JSON API)

on:
  schedule:
    # 매주 토요일 20:50 (KST) = UTC 11:50
    - cron: '50 11 * * 6'
  
  # 수동 실행
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install requests
      run: pip install requests
    
    - name: 🎰 Run JSON API Crawler
      run: python update_lotto_selenium.py
    
    - name: 📊 Check Result
      run: |
        if [ -f lotto_json.json ]; then
          echo "✅ JSON 파일 생성 확인"
          echo "파일 크기: $(wc -c < lotto_json.json) bytes"
          
          python3 << 'EOF'
        import json
        with open('lotto_json.json', 'r', encoding='utf-8') as f:
            data = json.load(f)
            count = len(data['data']['list'])
            latest = max(item['ltEpsd'] for item in data['data']['list'])
            print(f"총 {count}개 회차, 최신: {latest}회")
        EOF
        else
          echo "❌ JSON 파일이 생성되지 않았습니다"
          exit 1
        fi
    
    - name: 💾 Commit and Push
      run: |
        git config user.name 'Lotto Bot'
        git config user.email 'bot@lotto.com'
        git add lotto_json.json
        
        if git diff --staged --quiet; then
          echo "ℹ️  변경사항 없음"
        else
          git commit -m "🎰 자동 업데이트: $(date +'%Y-%m-%d %H:%M') KST"
          git push
          echo "✅ 업데이트 완료!"
        fi
